name: Evaluate pinned dcli-bootc

on:
  pull_request:
    branches: [main]
    paths:
      - experiments/dcli-bootc/**
      - tools/evaluate-dcli.sh
      - tools/audit-dcli.py
      - .github/workflows/evaluate-dcli.yml
      - Justfile
      - image-template.env
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dcli-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          echo "RUSTUP_TOOLCHAIN=1.99.0" >> "$GITHUB_ENV"
      - name: Generate, audit and build the experimental image
        run: bash tools/evaluate-dcli.sh build
      - name: Save generated files and audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dcli-bootc-evaluation
          path: _build_dcli_evaluation/
          if-no-files-found: warn
          retention-days: 14
